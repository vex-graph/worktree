name: Vexgraph Ecosystem CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Weekly readiness scoreboard over the whole ecosystem (Monday 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Architecture, preferences, ledger and tooling (root repo)
  # ───────────────────────────────────────────────────────────────────────────
  audit:
    name: Architecture, Preferences & Tooling Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workspace Root
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tooling tests, the ledger and the ratchets live in nested checkouts
      # (`tests/`) or scan them (`suite/`), so the manifest must be present
      # before anything else runs. A root-only checkout would also make the
      # workspace-scoped ratchets vacuous: zero files scanned, every recorded
      # violation reported "retired".
      - name: Clone declared repositories
        env:
          ECOSYSTEM_PAT: ${{ secrets.ECOSYSTEM_PAT }}
        run: |
          if [ -n "${ECOSYSTEM_PAT:-}" ]; then
            python3 tools/ci_repos.py clone --auth "$ECOSYSTEM_PAT"
          else
            python3 tools/ci_repos.py clone
          fi

      - name: Require every checkout
        run: python3 tools/ci_repos.py check --require-all

      - name: Tooling tests
        run: |
          python3 -B tests/tools/linter_test.py
          python3 -B tests/tools/arrange_test.py
          python3 -B tests/tools/readiness_test.py
          python3 -B tests/tools/test_checklist_test.py
          python3 -B tests/tools/ci_repos_test.py
          python3 -B tests/tools/prefs_test.py

      - name: Preferences integrity (budget, injection, lawbooks)
        run: ./tools/prefs check

      - name: Checklist evidence ledger is current
        run: python3 tools/test_checklist.py check

      - name: Architectural compliance (ratchet baseline)
        run: |
          python3 tools/linter.py --no-color \
            --baseline .github/lint-baseline.json

      - name: Structural layout (ratchet baseline)
        run: |
          python3 tools/arrange.py \
            --baseline .github/arrange-baseline.json

      - name: Security baseline (SECURITY.md compliance)
        run: |
          echo "=== Scanning for Accidental Secrets & Private Keys ==="
          if git grep -E -i "BEGIN (RSA|EC|DSA|OPENSSH|PRIVATE) KEY" -- ':(exclude)_notes/' ':(exclude)_trash/'; then
            echo "::error::Private keys detected in tracked files!"
            exit 1
          fi

          echo "=== Auditing Declared Security Obligations (;;SECURITY) ==="
          grep -rn ';;SECURITY' . --exclude-dir={.git,_notes,_trash,suite} || true

          echo "=== Auditing Deliberate Delays (;;FREEZE) ==="
          grep -rn ';;FREEZE' . --exclude-dir={.git,_notes,_trash,suite} || true

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1b: Tooling portability on Windows
  #
  # This proves the Python toolchain (linter, arranger, readiness, ci_repos,
  # checklist, preferences) runs on Windows with the same ratchet baselines.
  # It does NOT build the ecosystem: tools/b is still macOS/Linux (POSIX
  # fork/waitpid, -arch arm64, .so/.dylib). The ecosystem build job stays
  # absent until that port lands; no compile-only placeholder here.
  # ───────────────────────────────────────────────────────────────────────────
  tools-windows:
    name: Tooling Portability (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout Workspace Root
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same reason as the Linux audit: the tests and the ratchets need the
      # nested checkouts, not just this root repository.
      - name: Clone declared repositories
        shell: bash
        env:
          ECOSYSTEM_PAT: ${{ secrets.ECOSYSTEM_PAT }}
        run: |
          if [ -n "${ECOSYSTEM_PAT:-}" ]; then
            python tools/ci_repos.py clone --auth "$ECOSYSTEM_PAT"
          else
            python tools/ci_repos.py clone
          fi

      - name: Require every checkout
        shell: bash
        run: python tools/ci_repos.py check --require-all

      - name: Tooling tests
        shell: bash
        run: |
          python -B tests/tools/linter_test.py
          python -B tests/tools/arrange_test.py
          python -B tests/tools/readiness_test.py
          python -B tests/tools/test_checklist_test.py
          python -B tests/tools/ci_repos_test.py
          python -B tests/tools/prefs_test.py

      - name: Preferences integrity (budget, injection, lawbooks)
        shell: bash
        run: python tools/prefs check

      # The ledger hashes exact file bytes. A Windows checkout can apply
      # CRLF, which would report every row stale for a line-ending artifact
      # rather than a content change, so the ledger gate stays on Linux and
      # the checklist's own unit test above still proves the tool on Windows.

      - name: Architectural compliance (ratchet baseline)
        shell: bash
        run: |
          python tools/linter.py --no-color \
            --baseline .github/lint-baseline.json

      - name: Structural layout (ratchet baseline)
        shell: bash
        run: |
          python tools/arrange.py \
            --baseline .github/arrange-baseline.json

      - name: Native Build Tooling Proof (Windows)
        shell: bash
        run: |
          export B_HOME="${RUNNER_TEMP:-/tmp}/vexgraph_b"
          python -B tests/b/util_test.py

      - name: Scope statement
        shell: bash
        run: |
          echo 'Tooling portability and native b/util.c execution proven on Windows. Full ecosystem target builds run on macOS/Linux runners.' >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Ecosystem readiness scoreboard (weekly / on demand)
  # Clones every declared repository from tools/platforms.json, then reports.
  # ───────────────────────────────────────────────────────────────────────────
  readiness:
    name: Readiness Scoreboard
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workspace Root
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone declared repositories
        run: python3 tools/ci_repos.py clone

      - name: Require every checkout
        run: python3 tools/ci_repos.py check --require-all

      - name: Publish scoreboard
        run: |
          python3 tools/readiness.py --markdown >> "$GITHUB_STEP_SUMMARY"
          python3 tools/readiness.py

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Semicolon TUI build, bedrock & ecosystem proof (macOS & Linux matrix)
  #
  # Multi-architecture matrix:
  # - macOS Apple Silicon (ARM64)
  # - macOS Intel (x86_64 non-silicon)
  # - Linux x86_64 (ubuntu-latest)
  # - Linux ARM64 (ubuntu-24.04-arm)
  # ───────────────────────────────────────────────────────────────────────────
  semicolon-tui:
    name: Ecosystem & Bedrock (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
            os_family: darwin
          - os: macos-13
            platform: darwin-x86_64
            os_family: darwin
          - os: ubuntu-latest
            platform: linux-x86_64
            os_family: linux
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            os_family: linux

    steps:
      - name: Checkout Workspace Root
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies (Linux)
        if: matrix.os_family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libncurses-dev glslang-tools libvulkan-dev

      - name: Install LLVM & Shader Dependencies (macOS)
        if: matrix.os_family == 'darwin'
        run: brew install llvm glslang molten-vk

      - name: Configure Compiler Toolchain
        shell: bash
        run: |
          if [ "${{ matrix.os_family }}" = "darwin" ]; then
            llvm_bin="$(brew --prefix llvm 2>/dev/null)/bin/clang"
            if [ -x "$llvm_bin" ]; then
              echo "COMPILER=$llvm_bin" >> "$GITHUB_ENV"
            else
              echo "COMPILER=clang" >> "$GITHUB_ENV"
            fi
          else
            echo "COMPILER=clang" >> "$GITHUB_ENV"
          fi

      - name: Clone declared repositories
        shell: bash
        env:
          ECOSYSTEM_PAT: ${{ secrets.ECOSYSTEM_PAT }}
        run: |
          if [ -n "${ECOSYSTEM_PAT:-}" ]; then
            python3 tools/ci_repos.py clone --auth "$ECOSYSTEM_PAT"
          else
            python3 tools/ci_repos.py clone
          fi

      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('suite/ecosystem/relational-engine/rust/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Fetch Rust Dependencies for C ABI Scratchpad
        shell: bash
        run: |
          cargo fetch --locked --manifest-path suite/ecosystem/relational-engine/rust/Cargo.toml

      - name: Verify Workspace Build Graph (${{ matrix.platform }})
        shell: bash
        run: |
          export CC="$COMPILER"
          export B_HOME="${RUNNER_TEMP:-/tmp}/vexgraph_b"
          ./tools/b targets

      - name: Build Semicolon TUI Binary
        shell: bash
        run: |
          python3 suite/projects/semicolon/build.py --compiler "$COMPILER" --output suite/projects/semicolon/.build/semicolon-tui

      - name: Run Memory-Sanitized Tests (ASan / UBSan & PTY Proof)
        shell: bash
        run: |
          export CC="$COMPILER"
          python3 tests/semicolon/editor/run.py

      - name: Run Bedrock & Ecosystem Tests (${{ matrix.platform }})
        shell: bash
        run: |
          export CC="$COMPILER"
          export B_HOME="${RUNNER_TEMP:-/tmp}/vexgraph_b"
          ./tools/b test hot_behavior_test
          ./tools/b test two_dylib_swap_test
          ./tools/b test console_test

      - name: Upload Semicolon Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semicolon-tui-${{ matrix.platform }}
          path: suite/projects/semicolon/.build/semicolon-tui
